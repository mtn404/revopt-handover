name: Daily snapshot refresh

# Runs every morning at 08:30 UTC — 15 minutes before NESO EAC gate
# closure (09:00 UTC). Re-stamps freshness on the dashboard's
# snapshot.json and pulls the last 14 days of public market data.
#
# Once the live LP path is wired up (see pipeline/orchestration/README.md), this
# workflow will also rebuild the master parquet, run inference, solve
# the LP for the next 24 h, and update the snapshot with real numbers.
# Until then it runs in "bootstrap" mode: dashboard mode stays
# BACKTEST and the freshness timestamp updates daily.

on:
  schedule:
    - cron: "30 8 * * *"     # daily 08:30 UTC
  workflow_dispatch: {}      # manual trigger

# We need write permission to push the updated snapshot back.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh snapshot
        # SUPABASE_URL is a non-sensitive public REST endpoint — read it from
        # repo Variables (visible in logs for debugging). Falls back to
        # Secrets for back-compat. The service-role key STAYS a Secret.
        env:
          SUPABASE_URL:              ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET:           ${{ vars.SUPABASE_BUCKET || secrets.SUPABASE_BUCKET }}
        run: |
          python pipeline/orchestration/refresh_snapshot.py

      - name: Commit refreshed snapshot
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(refresh): daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
